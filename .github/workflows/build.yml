name: APK derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: JDK Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle Yetkisi Ver
      run: chmod +x gradlew

    - name: APK Oluştur (Build)
      run: gradle assembleDebug

    - name: APK Dosyasını Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: kuran-mealleri-apk
        path: app/build/outputs/apk/debug/app-debug.apk
